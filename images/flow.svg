<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Flowchart: question, retrieve, LLM drafts, two rule checks leading to High confidence, Check before using, or Needs an expert" font-family="Inter, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2D5BD8"/></marker></defs><rect x="0" y="0" width="1600" height="640" rx="0" fill="#FFFFFF"/><text font-size="26" font-weight="700" fill="#14213D" text-anchor="start"><tspan x="40" y="51.3">How the assistant decides how far to trust an answer</tspan></text><rect x="40" y="250" width="180" height="100" rx="50" fill="#14213D"/><text font-size="20" font-weight="700" fill="#F4F2EC" text-anchor="middle"><tspan x="130.0" y="290.4">Question</tspan></text><text font-size="15" font-weight="400" fill="#C3CADB" text-anchor="middle"><tspan x="130.0" y="318.3">Plain language</tspan></text><rect x="270" y="250" width="200" height="100" rx="14" fill="#FFFFFF" stroke="#D8DCE6" stroke-width="2"/><text font-size="20" font-weight="700" fill="#14213D" text-anchor="middle"><tspan x="370.0" y="290.4">Retrieve</tspan></text><text font-size="15" font-weight="400" fill="#4A5675" text-anchor="middle"><tspan x="370.0" y="318.3">Top 5 of 30 documents</tspan></text><rect x="520" y="245" width="230" height="110" rx="14" fill="#FFFFFF" stroke="#D8DCE6" stroke-width="2"/><text font-size="20" font-weight="700" fill="#14213D" text-anchor="middle"><tspan x="635.0" y="280.4">LLM drafts</tspan></text><text font-size="15" font-weight="400" fill="#4A5675" text-anchor="middle"><tspan x="635.0" y="308.3">Answer, citations,</tspan><tspan x="635.0" y="328.2">and risk flags</tspan></text><polygon points="915,210.0 1040.0,300 915,390.0 790.0,300" fill="#F4F2EC" stroke="#14213D" stroke-width="2"/><text font-size="15" font-weight="600" fill="#14213D" text-anchor="middle"><tspan x="915" y="282.3">Answerable, cited,</tspan><tspan x="915" y="301.8">no conflict,</tspan><tspan x="915" y="321.3">not legal?</tspan></text><polygon points="1230,220.0 1345.0,300 1230,380.0 1115.0,300" fill="#F4F2EC" stroke="#14213D" stroke-width="2"/><text font-size="15" font-weight="600" fill="#14213D" text-anchor="middle"><tspan x="1230" y="292.3">Any source old</tspan><tspan x="1230" y="311.8">or archived?</tspan></text><rect x="1388" y="250" width="192" height="100" rx="14" fill="#E4F3EC"/><text font-size="20" font-weight="700" fill="#11653F" text-anchor="middle"><tspan x="1484.0" y="290.4">High confidence</tspan></text><text font-size="15" font-weight="400" fill="#4A5675" text-anchor="middle"><tspan x="1484.0" y="318.3">Answer + citations</tspan></text><rect x="1130" y="70" width="200" height="100" rx="14" fill="#FBEEDB"/><text font-size="20" font-weight="700" fill="#8A4B06" text-anchor="middle"><tspan x="1230.0" y="100.4">Check before using</tspan></text><text font-size="15" font-weight="400" fill="#4A5675" text-anchor="middle"><tspan x="1230.0" y="128.3">Warning first,</tspan><tspan x="1230.0" y="148.2">confirm with expert</tspan></text><rect x="800" y="480" width="230" height="104" rx="14" fill="#14213D"/><text font-size="20" font-weight="700" fill="#F2A65A" text-anchor="middle"><tspan x="915.0" y="512.4">Needs an expert</tspan></text><text font-size="15" font-weight="400" fill="#C3CADB" text-anchor="middle"><tspan x="915.0" y="540.3">Nothing generated;</tspan><tspan x="915.0" y="560.2">routed with context</tspan></text><rect x="1110" y="480" width="250" height="104" rx="14" fill="#F4F2EC"/><text font-size="20" font-weight="700" fill="#14213D" text-anchor="middle"><tspan x="1235.0" y="512.4">Expert replies</tspan></text><text font-size="15" font-weight="400" fill="#4A5675" text-anchor="middle"><tspan x="1235.0" y="540.3">Answer saved</tspan><tspan x="1235.0" y="560.2">for next time</tspan></text><polyline points="220,300 266,300" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="470,300 516,300" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="750,300 786,300" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="1040,300 1111,300" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="915,390 915,476" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="1345,300 1384,300" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="1230,220 1230,174" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="1030,532 1106,532" fill="none" stroke="#2D5BD8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text font-size="15" font-weight="700" fill="#2D5BD8" text-anchor="start"><tspan x="1058" y="282.3">Yes</tspan></text><text font-size="15" font-weight="700" fill="#2D5BD8" text-anchor="start"><tspan x="927" y="424.3">No</tspan></text><text font-size="15" font-weight="700" fill="#2D5BD8" text-anchor="start"><tspan x="1350" y="282.3">No</tspan></text><text font-size="15" font-weight="700" fill="#2D5BD8" text-anchor="start"><tspan x="1242" y="190.3">Yes</tspan></text></svg>